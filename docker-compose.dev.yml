# Local development: only Postgres runs in Docker; the app runs on the host
# with `pnpm dev` for fast iteration.
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: aydin_autoglas
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d aydin_autoglas']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
