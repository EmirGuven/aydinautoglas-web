##
## Standalone deployment (a dedicated server, this app owns the whole box) — the original
## prompt.md §10 setup: bundled PostgreSQL + optional Caddy for automatic HTTPS.
##
## If this app is instead being deployed alongside other apps on a shared server (Traefik
## already running, a shared PostgreSQL instance), use docker-compose.yml instead — see
## docs/deployment-shared-server.md. This file remains for the original single-server
## scenario documented in docs/deployment.md.
##
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: aydin_autoglas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d aydin_autoglas']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/aydin_autoglas
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      NODE_ENV: production
    ports:
      - '3000:3000'
    volumes:
      - uploads:/app/uploads

  # Optional reverse proxy with automatic HTTPS. Enable with:
  #   docker compose -f docker-compose.standalone.yml --profile proxy up
  caddy:
    image: caddy:2-alpine
    profiles: ['proxy']
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
